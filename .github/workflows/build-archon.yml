# Build one Archon commit into a checksummed linux binary and publish it as a release.
#
# This workflow lives in the repository it publishes to, so that it can use the automatic
# repository-scoped GITHUB_TOKEN. Publishing from another repository would need a personal
# access token, and not needing one is better than scoping one.
#
# WHAT A RELEASE CONTAINS:
#
#   archon-linux-x64   the binary
#   checksums.txt      its sha256, in `sha256sum -c` format
#   provenance.json    the RESOLVED commit it was built from -- never a branch name,
#                      because a branch names a different commit tomorrow
#
# THE WEB DIST IS A TRUST ANCHOR, NOT A BUILD ARTEFACT. Upstream's build script refuses to
# produce a release binary without `archon-web.tar.gz`, and it is right to: the tarball's
# sha256 is compiled into the binary as BUNDLED_WEB_DIST_SHA256, and the binary prefers
# that over a checksum fetched from the same place that serves the file.
# `is_release_build()` is true whenever CI is set, so every build here is a release build.
# Unsetting CI would make this pass in one line and would silently downgrade that
# guarantee. So the dist is built and packaged the way upstream's own release workflow
# does it -- deterministic tar flags included, so an independent rebuild of the same
# commit produces the same bytes.

name: build-archon

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Archon ref to build -- a commit SHA, or a branch/tag name."
        required: true
        default: dev
      upstream:
        description: "Upstream repository."
        required: false
        default: coleam00/Archon
# leave a partially-uploaded artifact that a later download reads as complete.
concurrency:
  group: build-archon
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the upstream engine at the requested ref
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.upstream }}
          ref: ${{ inputs.ref }}
          # Full history: the ref may be a branch name, and the RESOLVED SHA is what
          # gets recorded as provenance. A shallow clone still resolves it, but a full
          # one also lets the build embed a meaningful describe/commit if it wants to.
          fetch-depth: 0
          path: upstream

      - name: Resolve the ref to an exact commit
        id: resolve
        # PROVENANCE IS A SHA, NEVER A BRANCH NAME. The record has to identify the
        # source precisely enough to reproduce the build, and `dev` names a different
        # commit tomorrow. This is the value published as provenance and the value
        # anyone would re-dispatch with.
        working-directory: upstream
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "Building ${{ inputs.upstream }} at $sha"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The floor this build needs. Pinned rather than `latest`, so a toolchain
          # release cannot change what a rebuild of the same SHA produces -- which is the
          # difference between reproducible and merely repeatable.
          bun-version: 1.3.0

      - name: Install dependencies
        working-directory: upstream
        run: bun install --frozen-lockfile

      # THE WEB DIST, AND WHY THE BUILD REFUSES WITHOUT IT.
      #
      # `scripts/build-binaries.sh` treats ANY build on Actions as a release build --
      # `is_release_build()` is true whenever `CI` is set, and GitHub sets `CI=true` on
      # every runner. A release build without `archon-web.tar.gz` exits 1 with
      # "refusing to build CI/release binary without embedded web dist checksum".
      # Measured 2026-08-26, run 33024116245: checkout and `bun install --frozen-lockfile`
      # both passed and this is where it stopped.
      #
      # UNSETTING `CI` WOULD FIX IT IN ONE LINE AND IS REFUSED. The tarball's sha256 is
      # compiled into the binary as `BUNDLED_WEB_DIST_SHA256`, and `serve.ts` prefers it
      # over the release's own checksums.txt -- upstream's words: "(independent trust
      # anchor) over the remote checksums.txt (same-source, weaker guarantee)". An empty
      # constant does not disable verification; it downgrades it to fetching the checksum
      # from the same place that serves the file. Weakening a checksum guarantee for the
      # convenience of the build is not a fix.
      #
      # So the dist is built and packaged the way upstream's own release.yml does it,
      # flags included. Deterministic tar so an independent rebuild from source produces
      # the same bytes: --mtime='@0' clamps timestamps, --sort=name removes
      # filesystem-order variance, --owner/--group/--numeric-owner zero out runner
      # identity.
      - name: Build the web UI
        working-directory: upstream
        run: bun --filter @archon/web build

      - name: Package the web dist beside the source, where the build script looks
        working-directory: upstream
        run: |
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' \
            -czf archon-web.tar.gz -C packages/web/dist .
          sha256sum archon-web.tar.gz

      - name: Build the binaries
        working-directory: upstream
        run: bun run build:binaries

      - name: Locate the linux-x64 binary
        id: locate
        # SEARCHED, NOT ASSUMED. The upstream build script's output directory is not
        # this project's to depend on, and a path that silently moves would produce a
        # job that succeeds and publishes nothing -- an empty result indistinguishable
        # from a successful build, which is the failure this project is built to refuse.
        working-directory: upstream
        run: |
          set -euo pipefail
          found=$(find . -type f -name 'archon-linux-x64' -not -path './node_modules/*' | head -n1)
          if [ -z "$found" ]; then
            echo "::error::build:binaries produced no archon-linux-x64. Searched from $(pwd)." >&2
            echo "--- files matching archon-* ---" >&2
            find . -type f -name 'archon-*' -not -path './node_modules/*' | head -20 >&2
            exit 1
          fi
          echo "path=$found" >> "$GITHUB_OUTPUT"
          ls -la "$found"

      - name: Publish the artifact with its checksum
        id: checksum
        working-directory: upstream
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          cp "${{ steps.locate.outputs.path }}" "$RUNNER_TEMP/out/archon-linux-x64"
          chmod 0755 "$RUNNER_TEMP/out/archon-linux-x64"
          cd "$RUNNER_TEMP/out"
          sha256sum archon-linux-x64 > checksums.txt
          sum=$(cut -d' ' -f1 checksums.txt)
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"

          # The provenance record published beside the binary. `kind` distinguishes a
          # binary built here from one mirrored from an upstream release, so a consumer
          # can tell the two apart by field value rather than by inference.
          cat > provenance.json <<JSON
          {
            "kind": "built-artifact",
            "repo": "${{ inputs.upstream }}",
            "ref": "${{ steps.resolve.outputs.sha }}",
            "requested_ref": "${{ inputs.ref }}",
            "asset": "archon-linux-x64",
            "sha256": "$sum",
            "built_by": "${{ github.repository }} build-archon #${{ github.run_number }}",
            "bun": "1.3.0"
          }
          JSON
          cat provenance.json

      - name: Verify the published checksum against the published file
        # The job checks its OWN output before anyone downloads it. A checksum computed
        # from a different file than the one published is the one failure a consumer
        # cannot distinguish from a corrupted download.
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          sha256sum -c checksums.txt
          echo "published sha256: ${{ steps.checksum.outputs.sha256 }}"

      - name: Compute the candidate tag
        id: tag
        working-directory: upstream
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/out/archon-linux-x64"
          # Asked of the ARTIFACT, never assumed from the ref.
          line=$("$RUNNER_TEMP/out/archon-linux-x64" --version 2>/dev/null | head -n1)
          reported=${line##*Archon CLI v}
          reported=${reported%% *}
          case "$reported" in
            [0-9]*) ;;
            *) echo "::error::the built binary did not report a version; refusing to guess one" >&2; exit 1 ;;
          esac
          # Committer date of the RESOLVED commit, digits only so sort -V compares it numerically.
          raw=$(git show -s --format=%cI "${{ steps.resolve.outputs.sha }}" | tr -d ':-')
          cdate=$(printf '%s' "${raw%%+*}" | cut -c1-13)
          tag="v${reported}-dev.${cdate}.${{ steps.resolve.outputs.short }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "candidate tag: $tag"

      - name: Publish the candidate as a release
        env:
          # The automatic, repository-scoped token. No secret is configured or needed.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          notes=$(printf '%s\n\n%s\n%s\n\n%s\n' \
            "CI build of ${{ inputs.upstream }} at ${{ steps.resolve.outputs.sha }}." \
            "kind: built-artifact" \
            "sha256: ${{ steps.checksum.outputs.sha256 }}" \
            "Binaries and nothing else -- see the repository README.")
          gh release create "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" --title "${{ steps.tag.outputs.tag }}" --notes "$notes" archon-linux-x64 checksums.txt provenance.json

      # THE JOB CHECKS ITS OWN PUBLISHED RELEASE, not just its own local file. A checksum
      # that matches the artifact on the runner says nothing about what the RELEASE
      # serves, and a release serving a different file is the one failure a consumer
      # cannot distinguish from a corrupted download.
      - name: Confirm the published release serves what was built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=$(mktemp -d); cd "$v"
          gh release download "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" --pattern 'archon-linux-x64' --pattern 'checksums.txt'
          sha256sum -c checksums.txt
          got=$(sha256sum archon-linux-x64 | cut -d' ' -f1)
          if [ "$got" != "${{ steps.checksum.outputs.sha256 }}" ]; then
            echo "::error::the published release serves $got but this job built ${{ steps.checksum.outputs.sha256 }}" >&2
            exit 1
          fi
          echo "published release verified: $got"
